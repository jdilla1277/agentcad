[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcad"
version = "0.4.0"
description = "CLI CAD tool for AI agents. Write build123d scripts, with CadQuery compatibility, and get STEP files, renders, and metrics."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{name = "James Dillard"}]
keywords = ["cad", "agent", "build123d", "cadquery", "3d", "geometry", "ai", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "cadquery>=2.0",
    # Cap below 0.11: build123d 0.11 switched to cadquery-ocp-novtk (OCP 7.9),
    # which collides with the cadquery-ocp 7.8 that `cadquery` pins. Two OCP
    # builds on one path means `import build123d` dies with
    # "TopoDS has no attribute 'Vertex'", breaking the default runtime on a
    # clean install. 0.10.x shares cadquery's cadquery-ocp 7.8 — no conflict.
    "build123d>=0.10,<0.11",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0", "pytest-timeout>=2.0", "playwright>=1.40"]

[project.urls]
Repository = "https://github.com/jdilla1277/agentcad"


[project.scripts]
agentcad = "agentcad.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Both suites are part of "running the tests": `tests_b3d/` is the primary
# build123d integration suite, while `tests/` covers shared behavior and the
# focused CadQuery compatibility contract. Listing both here means bare
# `pytest` cannot silently skip the primary runtime. PR #142 shipped a
# build123d-runner regression after only `tests/` ran; this prevents recurrence.
testpaths = ["tests", "tests_b3d"]
# Hard per-test timeout so a wedged test (e.g. a daemon fork that
# never completes, a hung subprocess holding a socket) fails loudly
# with a traceback instead of pinning a worker at 0% CPU for the
# rest of the run. PR #194's retro called this out after two pytest
# runs wedged for 23+ minutes on leaked subprocess daemons. 120s
# accommodates the slowest legitimate tests (cold OCP imports +
# preview renders). Individual tests can override via the
# @pytest.mark.timeout decorator if they truly need longer.
timeout = 120
markers = [
    "browser: browser-level viewer smoke tests that require Playwright browsers",
]
