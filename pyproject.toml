[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcad"
version = "0.2.0"
description = "CLI CAD tool for AI agents. Write CadQuery scripts, get STEP files, renders, and metrics."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
authors = [{name = "James Dillard"}]
keywords = ["cad", "agent", "cadquery", "3d", "geometry", "ai", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["click>=8.0", "cadquery>=2.0", "build123d>=0.9"]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
dev = ["pytest>=8.0", "pytest-timeout>=2.0"]

[project.urls]
Repository = "https://github.com/jdilla1277/agentcad"


[project.scripts]
agentcad = "agentcad.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Both suites are part of "running the tests" — `tests/` covers the
# cadquery path, `tests_b3d/` covers the build123d path. Listing both
# here means bare `pytest` (no args) collects from both, so it's not
# possible to run one and silently skip the other. PR #142 shipped a
# b3d-runner regression because the pre-merge check was `pytest tests/`
# only; this prevents the recurrence at the config layer.
testpaths = ["tests", "tests_b3d"]
# Hard per-test timeout so a wedged test (e.g. a daemon fork that
# never completes, a hung subprocess holding a socket) fails loudly
# with a traceback instead of pinning a worker at 0% CPU for the
# rest of the run. PR #194's retro called this out after two pytest
# runs wedged for 23+ minutes on leaked subprocess daemons. 120s
# accommodates the slowest legitimate tests (cold OCP imports +
# preview renders). Individual tests can override via the
# @pytest.mark.timeout decorator if they truly need longer.
timeout = 120
