[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcad"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["click>=8.0", "cadquery>=2.0"]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]

[project.scripts]
agentcad = "agentcad.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
