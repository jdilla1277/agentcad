name: Sync released skill to public mirror

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      SKILL_SYNC_SSH_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable package tag to retry (for example v0.7.2)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: agentcad-stable-skill-publication
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require mirror deploy key
        env:
          SKILL_SYNC_SSH_KEY: ${{ secrets.SKILL_SYNC_SSH_KEY }}
        run: test -n "$SKILL_SYNC_SSH_KEY"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: publisher

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: pip install pyyaml

      - name: Verify release and successful package upload
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python publisher/scripts/prepare_skill_release.py resolve --tag "$RELEASE_TAG" --manifest release-source.json

      - name: Checkout exact released source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.source_revision }}
          path: released

      - name: Match the published wheel and generate the released skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publisher/scripts/prepare_skill_release.py prepare --source released --manifest release-source.json --output prepared

      - name: Checkout public skill repo
        uses: actions/checkout@v4
        with:
          repository: jdilla1277/agentcad-skill
          ssh-key: ${{ secrets.SKILL_SYNC_SSH_KEY }}
          path: public-skill

      - name: Recheck publication and commit only changed content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python publisher/scripts/prepare_skill_release.py verify --manifest release-source.json --mirror public-skill
          cp prepared/SKILL.md prepared/release.json public-skill/
          cd public-skill
          git config user.name "agentcad-sync[bot]"
          git config user.email "agentcad-sync@users.noreply.github.com"
          git add SKILL.md release.json
          if git diff --cached --quiet; then
            echo "The stable skill already matches this published package."
            exit 0
          fi
          git commit -m "Sync skill with verified published package"
          git push
