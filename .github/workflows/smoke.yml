name: Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  collect:
    runs-on: ubuntu-22.04
    name: pytest --collect-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agentcad + test dependencies
        run: pip install -e .[mcp,dev]

      - name: Collect tests
        run: pytest --collect-only -q

      - name: Run OCP-free interface guardrails
        run: pytest tests/test_help_consistency.py tests/test_package_positioning.py -q

  windows-platform:
    runs-on: windows-latest
    name: Windows platform check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agentcad + test dependencies
        run: pip install -e .[mcp,dev]

      - name: Collect tests
        run: pytest --collect-only -q

      - name: Run Windows-relevant guardrails
        run: pytest tests/test_daemon_platform.py tests/test_package_positioning.py -q

  browser-smoke:
    runs-on: ubuntu-22.04
    name: Browser viewer smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agentcad + browser test dependencies
        run: pip install -e .[mcp,dev]

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run browser viewer smoke
        env:
          AGENTCAD_BROWSER_SMOKE: "1"
        run: pytest tests/test_viewer_browser.py -q
