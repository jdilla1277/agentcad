name: Smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  collect:
    runs-on: ubuntu-22.04
    # Keep this exact name: branch protection requires it by name.
    name: pytest --collect-only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agentcad + test dependencies + CadQuery extra
        # The full profile. The CadQuery compatibility suite in tests/ builds
        # its fixtures with CadQuery, so it only collects here.
        run: pip install -e .[mcp,dev,cadquery]

      - name: Verify both runtimes import on a clean install
        # Catches dependency-resolution breakage (e.g. a second OCP generation
        # pulled in by an unpinned transitive dep) that pip and `pip check`
        # both miss. Nothing else in this workflow imports build123d.
        run: python -c "import build123d, cadquery; print(build123d.__version__)"

      - name: Collect tests
        run: pytest --collect-only -q

      - name: Run OCP-free interface guardrails
        run: pytest tests/test_help_consistency.py tests/test_package_positioning.py tests/test_docs.py tests/test_help.py tests/test_public_surface.py tests/test_project_viewer.py -q

      - name: Install Linux render smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri

      - name: Run Linux render guardrails under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
            env LIBGL_ALWAYS_SOFTWARE=1 pytest \
            tests/test_render.py::test_linux_render_window_uses_virtual_x11_drawable \
            tests/test_render.py::test_linux_display_connection_failure_is_actionable \
            tests/test_render.py::test_render_shape_produces_png \
            tests/test_render_cmd.py::test_render_defaults_to_800_by_600 \
            tests/test_render_cmd.py::test_render_unavailable_returns_actionable_json -q

  build123d-only:
    runs-on: ubuntu-22.04
    name: Default profile (no CadQuery extra)
    # The contract of `pip install agentcad`: build123d + OCP only. A full
    # environment cannot catch a hidden `import cadquery` on a shared command
    # path, so this profile exists to keep the default install honest. See
    # docs/product-plans/cadquery-optional.md.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agentcad + test dependencies (no cadquery extra)
        run: pip install -e .[mcp,dev]

      - name: Verify CadQuery and CasADi are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          missing = [m for m in ("cadquery", "casadi") if importlib.util.find_spec(m) is None]
          if missing != ["cadquery", "casadi"]:
              sys.exit(f"default profile must not include cadquery/casadi; found: {set(['cadquery','casadi']) - set(missing)}")
          print("cadquery and casadi absent")
          PY
          python -c "import build123d; print(build123d.__version__)"

      - name: Collect tests on the default profile
        # The repo conftest skips CadQuery-fixture modules here; collection
        # must still succeed for everything else.
        run: pytest --collect-only -q

      - name: Install Linux render smoke dependencies
        # The contract test and tests_b3d/test_render_cmd.py render PNGs,
        # which needs an X11/GLX display on Linux (see the full-profile job).
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri

      - name: Run the optional-extra contract + build123d command suites
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
            env LIBGL_ALWAYS_SOFTWARE=1 pytest \
            tests/test_cadquery_optional.py tests/test_written_mesh_validation.py tests_b3d/test_runner.py tests_b3d/test_export_cmd.py tests_b3d/test_render_cmd.py tests_b3d/test_inspect.py tests_b3d/test_diff.py tests_b3d/test_view.py -q

      - name: Run OCP-free interface guardrails
        run: pytest tests/test_help_consistency.py tests/test_package_positioning.py tests/test_docs.py tests/test_help.py tests/test_public_surface.py -q

  windows-platform:
    runs-on: windows-latest
    name: Windows platform check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agentcad + test dependencies (default profile)
        run: pip install -e .[mcp,dev]

      - name: Collect tests
        run: pytest --collect-only -q

      - name: Run Windows-relevant guardrails
        run: pytest tests/test_daemon_platform.py tests/test_package_positioning.py tests/test_project_viewer.py -q

  browser-smoke:
    runs-on: ubuntu-22.04
    name: Browser viewer smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install agentcad + browser test dependencies
        # tests/test_viewer_browser.py builds its fixtures through a CadQuery
        # project, so this job uses the full profile.
        run: pip install -e .[mcp,dev,cadquery]

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install CAD render display dependencies
        run: sudo apt-get install --no-install-recommends -y xvfb xauth libgl1-mesa-dri

      - name: Run browser viewer smoke
        env:
          AGENTCAD_BROWSER_SMOKE: "1"
        # WebKit is also exercised locally on macOS; this job installs Chromium.
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX" \
            env LIBGL_ALWAYS_SOFTWARE=1 pytest \
            tests/test_viewer_browser.py tests/test_live_viewer_browser.py \
            tests/test_validation_guidance.py -q -k 'not webkit'
